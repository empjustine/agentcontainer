{
  "globalTTL": 0,
  "healthCheckTimeout": 600,
  "includeAliasesInList": false,
  "startPort": 5800,
  "captureBuffer": 10,
  "logLevel": "debug",
  "logRequests": true,
  "logTimeFormat": "RFC3339",
  "logToStdout": "both",
  "metricsMaxInMemory": 1000,
  "performance": {
    "disabled": false,
    "every": "10s"
  },
  "sendLoadingState": false,
  "apiKeys": [
    "${env.PEER_API_KEY}"
  ],
  "ui": {
    "activity": {
      "session_id": [
        "X-Session-ID",
        "X-Litellm-Session-Id"
      ]
    }
  },
  "hooks": {},
  "profiles": {},
  "selectors": {},
  "routing": {},
  "macros": {
    "LLAMA_SERVER": "llama-server --port ${PORT} --log-verbosity 4 --threads-http 6 --log-colors off --no-ui --no-warmup --load-mode mmap --cache-idle-slots --kv-unified --cache-ram 8192 --flash-attn on --fit on --fit-target 1024 --no-context-shift --reasoning-preserve",
    "0text": "--no-mmproj --ubatch-size 512",
    "1vision": "--no-mmproj-offload --ubatch-size 2048",
    "2mmproj": "--ubatch-size 2048",
    "qwen38": "--temp 1.0 --top-p 0.95 --top-k 20 --repeat-penalty 1.00 --presence-penalty 0.00 --min-p 0.00 --chat-template-kwargs '{\"preserve_thinking\": true, \"reasoning_effort\": \"medium\"}'",
    "qwen36": "--temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.00 --presence-penalty 0.00 --min-p 0.00 --chat-template-kwargs '{\"preserve_thinking\": true}'",
    "glm47f": "--temp 0.7 --top-p 1.0 --min-p 0.01 --repeat-penalty 1.00",
    "lfm25": "--temp 0.2 --top-k 80 --repeat-penalty 1.05",
    "gemma4": "--temp 1.0 --top-p 0.95 --top-k 64",
    "devstral": "--temp 0.15",
    "laguna": "--temp 1.0 --top-p 1 --top-k 20 --min-p 0.0",
    "ling": "--temp 1.0 --top-p 0.95 --top-k 20",
    "museglimmer": "--temp 1.0 --top-p 0.95 --top-k 64",
    "deepseekv4": "--temp 1.0 --top-p 1.0  --min-p 0.01 --load-mode dio"
  }
}
