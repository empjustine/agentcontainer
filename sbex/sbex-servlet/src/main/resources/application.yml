# Production defaults live here; every value an operator owns is an
# environment variable with a local fallback. No secret is written down —
# credentials arrive through the deployment's environment (sbex/README.md).
spring:
  application:
    name: sbex-servlet
  datasource:
    url: ${SBEX_DB_URL:jdbc:postgresql://localhost:5432/sbex}
    username: ${SBEX_DB_USER:sbex}
    password: ${SBEX_DB_PASSWORD:}
    hikari:
      pool-name: sbex
      # The pool is the scarce resource: each checked-out connection is a
      # server-side backend, so the ceiling stays low and the rest of the
      # capacity lives in request threads (sbex/memory.md).
      maximum-pool-size: ${SBEX_DB_POOL:10}
      connection-timeout: 3000
      maximum-lifetime: 600000
      keepalive-time: 60000
      # A connection that outlives the threshold is dumped with its stack:
      # the leak shows itself at the step that owns it.
      leak-detection-threshold: 10000
  flyway:
    # {vendor} picks db/migration/postgresql or db/migration/oracle from the
    # JDBC URL — one location pattern, one schema history per engine.
    locations: classpath:db/migration/{vendor}
    fail-on-missing-locations: true
  rabbitmq:
    host: ${SBEX_AMQP_HOST:localhost}
    port: ${SBEX_AMQP_PORT:5672}
    username: ${SBEX_AMQP_USER:guest}
    password: ${SBEX_AMQP_PASSWORD:guest}
    # Confirms answer "did the broker take it", returns answer "could it be
    # routed" — without both, a publish is a blind write (sbex/messaging.md).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Prefetch bounds unacked messages per channel, concurrency bounds the
        # consumers — together they bound this instance's backlog.
        prefetch: ${SBEX_AMQP_PREFETCH:10}
        concurrency: 2
        max-concurrency: 4
  # Virtual threads make each request's stack heap-allocated: hundreds of
  # blocked-on-database requests stop costing hundreds of platform-thread
  # stacks (sbex/memory.md).
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # In-flight requests finish before the process exits — the container stop
  # signal becomes a drain, not a cut.
  shutdown: graceful
  tomcat:
    # With virtual threads the request pool no longer caps concurrency; the
    # bounds that remain are the connection ceiling and the database pool.
    max-connections: 200
    accept-count: 50
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        # Only what a probe or a dashboard reads: the write-capable and # introspective endpoints stay off the network.
        include: health,info,metrics
  endpoint:
    health:
      # Liveness/readiness paths for the orchestrator, separate from the
      # deep health that touches the database.
      probes:
        enabled: true

sbex:
  archive-batch-size: 500
  events-exchange: sbex.orders.events
